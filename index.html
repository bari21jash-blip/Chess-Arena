<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CHESS ARENA – play chess against six AI opponents, practice, pass-and-play and learn chess." />
    <meta name="theme-color" content="#0b1426" />
    <!-- YouTube Playables SDK: must be the first script on the page. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <title>CHESS ARENA – Think Smart. Play Better.</title>
    <!-- Critical first-frame styles for the loading splash (no external fonts or images). -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #060a14;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .boot-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(900px 500px at 50% -10%, #1b2b52 0%, rgba(11, 20, 38, 0) 62%),
          linear-gradient(180deg, #0b1426 0%, #060a14 60%, #03050a 100%);
        color: #f5d77a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .boot-logo {
        font-size: 56px;
        line-height: 1;
        color: #f5d77a;
        text-shadow: 0 0 24px rgba(212, 175, 55, 0.45);
        font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Apple Symbols", serif;
        animation: boot-bob 2.4s ease-in-out infinite;
      }
      .boot-title {
        font-family: Georgia, "Times New Roman", serif;
        letter-spacing: 0.16em;
        font-size: 26px;
        font-weight: 700;
        background-image: linear-gradient(180deg, #fff3c4 0%, #f5d77a 45%, #9a7820 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(212, 175, 55, 0.2);
        border-top-color: #d4af37;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-text {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
    </style>

ve.",from:"e2",to:"e4",success:"Great! That is your first move in chess.",hint:"Click the pawn on e2, then click the highlighted square e4."}},{id:2,title:"How the Pawn Moves",icon:"♟",summary:"Forward steps and diagonal captures",paragraphs:["Pawns move straight forward one square at a time. On their very first move they may advance two squares.","Pawns capture diagonally forward, one square. They can never capture straight ahead.","A pawn that reaches the last rank is promoted (you will learn about this in lesson 12)."],fen:"4k3/3p4/8/8/8/8/4P3/4K3 w - - 0 1",demo:["e2e4","d7d5","e4d5"],challenge:{text:"Move the e-pawn two squares forward from e2 to e4 on its first move.",from:"e2",to:"e4",success:"Excellent! Pawns can jump two squares on their first move.",hint:"Click the pawn on e2, then click e4."}},{id:3,title:"How the Rook Moves",icon:"♖",summary:"Straight lines along ranks and files",paragraphs:["The rook moves any number of empty squares in a straight line: along a rank (row) or a file (column).","A rook can capture an enemy piece on the first square it reaches, but it cannot jump over pieces.","Rooks are strongest on open files, which have no pawns blocking them."],fen:"4k3/8/8/8/3R4/8/8/4K3 w - - 0 1",demo:["d4h4","e8d8","h4h8"],challenge:{text:"Slide the rook from d4 to h4 along the fourth rank.",from:"d4",to:"h4",success:"Well done! The rook slides any distance in a straight line.",hint:"Click the rook on d4, then click h4."}},{id:4,title:"How the Knight Moves",icon:"♘",summary:"The L-shaped jumper",paragraphs:["The knight moves in an L shape: two squares in one direction and then one square sideways, or one square and then two.","Knights are the only pieces that can jump over other pieces. They do not care about blocked squares along the way.","A knight on a central square controls up to eight squares."],fen:"4k3/8/8/8/3N4/8/8/4K3 w - - 0 1",demo:["d4f5","e8d7","f5h6"],challenge:{text:"Jump the knight from d4 to f5.",from:"d4",to:"f5",success:"Nice jump! Knights are tricky and great for forks.",hint:"Click the knight on d4, then click f5."}},{id:5,title:"How the Bishop Moves",icon:"♗",summary:"Diagonal sliders on one colour",paragraphs:["The bishop moves any number of empty squares diagonally.","Each bishop stays on the same colour of square for the whole game. Players often keep a pair of bishops because they are powerful together.","Like rooks, bishops cannot jump over other pieces."],fen:"4k3/8/8/8/3B4/8/8/4K3 w - - 0 1",demo:["d4g7","e8d8","g7h6"],challenge:{text:"Move the bishop from d4 to g7 along the diagonal.",from:"d4",to:"g7",success:"Correct! Bishops glide along diagonals.",hint:"Click the bishop on d4, then click g7."}},{id:6,title:"How the Queen Moves",icon:"♕",summary:"The most powerful piece",paragraphs:["The queen combines the powers of a rook and a bishop. She moves any number of squares along ranks, files or diagonals.","The queen is worth about nine pawns, so keep her safe. Trading her for a minor piece is usually a mistake."],fen:"4k3/8/8/8/3Q4/8/8/4K3 w - - 0 1",demo:["d4a7","e8d8","a7a8"],challenge:{text:"Move the queen from d4 to a7 along the diagonal.",from:"d4",to:"a7",success:"Excellent! The queen is the most powerful piece on the board.",hint:"Click the queen on d4, then click a7."}},{id:7,title:"How the King Moves",icon:"♔",summary:"One step at a time, and never into danger",paragraphs:["The king moves exactly one square in any direction. The king is the most important piece: losing it means losing the game.","A king can never move into a square that is attacked by an enemy piece, and it can never stand next to the other king."],fen:"4k3/8/8/8/8/8/8/4K3 w - - 0 1",demo:["e1f2","e8d7","f2e2"],challenge:{text:"Move your king one square diagonally, from e1 to f2.",from:"e1",to:"f2",success:"Good! Kings move one square at a time.",hint:"Click the king on e1, then click f2."}},{id:8,title:"Understanding Check",icon:"⚠",summary:"When the king is attacked",paragraphs:["A king is in check when an enemy piece attacks it. You must respond immediately.","To escape check you can move the king to a safe square, capture the attacking piece, or block the attack with another piece.","The board highlights the king in red whenever it is in check. Illegal moves that leave the king in check are never allowed."],fen:"4k3/8/8/8/8/8/8/4R2K b - - 0 1",demo:["e8d8"],challenge:{text:"Black is in check from the rook on e1. Move the king to d8 to escape.",from:"e8",to:"d8",success:"You escaped the check!",hint:"Click the black king on e8, then click d8."}},{id:9,title:"Understanding Checkmate",icon:"♚",summary:"Check with no escape",paragraphs:["Checkmate happens when the king is in check and there is no legal way to get out of it. The game ends immediately, and the player who delivered it wins.","Look for back-rank mates: a rook slides to the last rank while the king is trapped behind its own pawns."],fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1",demo:["a1a8"],challenge:{text:"Deliver checkmate! Slide the rook from a1 to a8.",from:"a1",to:"a8",success:"Checkmate! The black king has no escape squares.",hint:"Click the rook on a1, then click a8."}},{id:10,title:"Castling",icon:"🏰",summary:"Hide the king and activate a rook",paragraphs:["Castling is the only move where two pieces move at once: the king moves two squares toward a rook, and the rook jumps over the king.","Castling is allowed only if neither the king nor that rook has moved, the squares between them are empty, and the king is not in check or passing through an attacked square."],fen:"r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1",demo:["e1g1","e8c8"],challenge:{text:"Castle kingside: move the king from e1 to g1.",from:"e1",to:"g1",success:"Castled! The king is safe and the rook is active.",hint:"Click the king on e1, then click g1."}},{id:11,title:"En Passant",icon:"⤢",summary:"A special pawn capture",paragraphs:["When an enemy pawn moves two squares forward and lands right beside your pawn, you may capture it as if it had mov
